name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Sync version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - run: npm ci

      - run: npm test

      - name: Make macOS ${{ matrix.arch }}
        run: npm run make -- --platform=darwin --arch=${{ matrix.arch }}

      - name: Stage release files
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.arch }}"
          mkdir -p staged
          dmg="$(find out/make -type f -name '*.dmg' | head -n 1)"
          zip="$(find out/make -type f -name '*.zip' | head -n 1)"
          test -n "$dmg"
          test -n "$zip"
          cp "$dmg" "staged/Switcheroo-${VERSION}-${ARCH}.dmg"
          cp "$zip" "staged/Switcheroo-${VERSION}-darwin-${ARCH}.zip"
          ls -la staged/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: staged/*
          if-no-files-found: error

  publish:
    needs: macos
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
