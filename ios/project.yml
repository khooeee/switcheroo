name: Switcheroo
options:
  bundleIdPrefix: com.khooeee
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Switcheroo:
    type: application
    platform: iOS
    sources:
      - path: Switcheroo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.khooeee.switcheroo
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Switcheroo
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Tapping a pairing link (switcheroo://<mac>.ts.net?token=…) opens the app.
        CFBundleURLTypes:
          - CFBundleURLName: com.khooeee.switcheroo.pair
            CFBundleURLSchemes: [switcheroo]
        # Plain http only to localhost, for the simulator; the tailnet is https via tailscale serve.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
